name: Build bundled Laya Android APK

on:
  push:
    branches:
      - ci/laya-bundled-apk-20260922
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout trigger repo
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch official Laya Android sample
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail
          git clone --depth 1 https://huggingface.co/litert-community/Laya-Multilingual-LiteRT.git laya-hf
          test -f laya-hf/android/gradlew
          chmod +x laya-hf/android/gradlew

      - name: Download WFP16 model assets
        shell: bash
        run: |
          set -euxo pipefail
          ASSETS="laya-hf/android/app/src/main/assets/laya_model"
          mkdir -p "$ASSETS"
          BASE="https://huggingface.co/litert-community/Laya-Multilingual-LiteRT/resolve/main"
          for FILE in \
            laya_ml_s256_embeds_wfp16.tflite \
            laya_ml_act_head_fp32.tflite \
            laya_ml_calibration.json \
            tokenizer.json \
            token_embeddings_fp16.bin \
            token_embeddings.json
          do
            curl -L --fail --retry 5 --retry-delay 3 \
              -o "$ASSETS/$FILE" "$BASE/$FILE?download=true"
          done
          test "$(stat -c%s "$ASSETS/laya_ml_s256_embeds_wfp16.tflite")" = "250889408"
          test "$(stat -c%s "$ASSETS/laya_ml_act_head_fp32.tflite")" = "795816"
          test "$(stat -c%s "$ASSETS/laya_ml_calibration.json")" = "9156"
          test "$(stat -c%s "$ASSETS/tokenizer.json")" = "34363188"
          test "$(stat -c%s "$ASSETS/token_embeddings_fp16.bin")" = "393216000"
          test "$(stat -c%s "$ASSETS/token_embeddings.json")" = "801"
          du -sh "$ASSETS"
          ls -lh "$ASSETS"

      - name: Add first-launch bundled model installer
        shell: bash
        run: |
          set -euxo pipefail
          cat > laya-hf/android/app/src/main/java/com/laya/BundledModelInstaller.kt <<'KOTLIN'
          // SPDX-License-Identifier: Apache-2.0
          package com.laya

          import android.content.Context
          import java.io.File
          import java.io.FileOutputStream

          /**
           * Copies the bundled WFP16 Laya model from APK assets into filesDir on first launch.
           * The upstream engine already expects these exact filenames in filesDir.
           */
          object BundledModelInstaller {
              private const val ASSET_DIR = "laya_model"

              private val files = linkedMapOf(
                  "laya_ml_s256_embeds_wfp16.tflite" to 250_889_408L,
                  "laya_ml_act_head_fp32.tflite" to 795_816L,
                  "laya_ml_calibration.json" to 9_156L,
                  "tokenizer.json" to 34_363_188L,
                  "token_embeddings_fp16.bin" to 393_216_000L,
                  "token_embeddings.json" to 801L,
              )

              fun ensureInstalled(context: Context, storage: LayaEngine.Storage) {
                  check(storage == LayaEngine.Storage.WFP16) {
                      "This bundled APK contains the WFP16 model only."
                  }

                  files.forEach { (name, expectedBytes) ->
                      val destination = File(context.filesDir, name)
                      if (destination.isFile && destination.length() == expectedBytes) return@forEach

                      if (destination.exists()) destination.delete()
                      val temporary = File(context.filesDir, "$name.part")
                      if (temporary.exists()) temporary.delete()

                      context.assets.open("$ASSET_DIR/$name").use { input ->
                          FileOutputStream(temporary).use { output ->
                              val buffer = ByteArray(4 * 1024 * 1024)
                              while (true) {
                                  val count = input.read(buffer)
                                  if (count < 0) break
                                  output.write(buffer, 0, count)
                              }
                              output.fd.sync()
                          }
                      }

                      check(temporary.length() == expectedBytes) {
                          "Bundled $name has ${temporary.length()} bytes; expected $expectedBytes"
                      }
                      check(temporary.renameTo(destination)) {
                          "Could not install bundled model file $name"
                      }
                  }
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          import re

          vm = Path("laya-hf/android/app/src/main/java/com/laya/MainViewModel.kt")
          text = vm.read_text()
          if "BundledModelInstaller.ensureInstalled(context, storage)" not in text:
              text, count = re.subn(
                  r"(?m)^(\s*)val requiredFiles\s*=",
                  r"\1BundledModelInstaller.ensureInstalled(context, storage)\n\1val requiredFiles =",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("MainViewModel requiredFiles insertion point not found")
          vm.write_text(text)

          gradle = Path("laya-hf/android/app/build.gradle.kts")
          text = gradle.read_text()
          if "noCompress += listOf" not in text:
              text, count = re.subn(
                  r"(?m)^(\s*)buildFeatures\s*\{",
                  r'\1androidResources {\n\1    noCompress += listOf("tflite", "bin")\n\1}\n\n\1buildFeatures {',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("build.gradle buildFeatures insertion point not found")
          gradle.write_text(text)
          PY

          grep -n "BundledModelInstaller" laya-hf/android/app/src/main/java/com/laya/MainViewModel.kt
          grep -n "noCompress" laya-hf/android/app/build.gradle.kts

      - name: Build bundled debug APK
        shell: bash
        working-directory: laya-hf/android
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon clean :app:assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "assets/laya_model/(laya_ml_s256_embeds_wfp16.tflite|token_embeddings_fp16.bin|tokenizer.json)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload bundled APK
        uses: actions/upload-artifact@v4
        with:
          name: laya-multilingual-bundled-debug
          path: laya-hf/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
