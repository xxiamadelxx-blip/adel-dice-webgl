name: Build Laya Android APK

on:
  push:
    branches:
      - ci/laya-apk-build-20260922
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout trigger repo
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch official Laya Android sample
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euxo pipefail
          git clone --depth 1 https://huggingface.co/litert-community/Laya-Multilingual-LiteRT.git laya-hf
          test -f laya-hf/android/gradlew
          chmod +x laya-hf/android/gradlew

      - name: Build debug and release APKs
        shell: bash
        working-directory: laya-hf/android
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon clean :app:assembleDebug :app:assembleRelease
          find app/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: laya-android-apks
          path: |
            laya-hf/android/app/build/outputs/apk/debug/*.apk
            laya-hf/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
